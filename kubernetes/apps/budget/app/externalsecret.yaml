---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Auth-layer secrets for budget-app. DATABASE_URL comes from budget-pguser-secret
# (generated by the cnpg component). Non-secret env (AUTH_URL, AUTH_TRUST_HOST,
# NODE_ENV, PORT, HOSTNAME) is set inline on the HelmRelease.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: budget-app
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: budget-app-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        AUTH_AUTHENTIK_ID: "{{ .BUDGET_OIDC_CLIENT_ID }}"
        AUTH_AUTHENTIK_SECRET: "{{ .BUDGET_OIDC_CLIENT_SECRET }}"
        # Trailing slash is byte-identical to the Authentik provider issuer URL.
        AUTH_AUTHENTIK_ISSUER: "https://sso.pipitonelabs.com/application/o/budget/"
        # Plaid bank-sync credentials (sandbox/production).
        PLAID_CLIENT_ID: "{{ .PLAID_CLIENT_ID }}"
        PLAID_SECRET: "{{ .PLAID_SECRET }}"
        PLAID_ENV: "{{ .PLAID_ENV }}"
        # 64-hex-char (32-byte) AES-256-GCM key for encrypting Plaid access tokens at rest.
        # NEVER rotate — changing this orphans all linked accounts.
        PLAID_ENCRYPTION_KEY: "{{ .PLAID_ENCRYPTION_KEY }}"
  dataFrom:
    - extract:
        key: budget
