---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# GHCR pull secret for the budget namespace. Reuses the pipitonelabs org PAT
# stored in the tradeforge 1Password item (same PAT, no duplicate needed).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-login
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ghcr-login
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"pipitonelabs","password":"{{ .tradeforge_github_pat }}","auth":"{{ printf "pipitonelabs:%s" .tradeforge_github_pat | b64enc }}"}}}
  data:
    - secretKey: tradeforge_github_pat
      remoteRef:
        key: tradeforge
        property: tradeforge_github_pat
