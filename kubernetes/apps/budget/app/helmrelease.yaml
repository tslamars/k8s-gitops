---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app budget-app
  namespace: &namespace budget
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 2
        strategy: RollingUpdate
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
                  app.kubernetes.io/instance: *app
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            envFrom:
              - secretRef:
                  name: budget-initdb-secret
          02-migrate:
            image:
              repository: ghcr.io/pipitonelabs/budget-app
              # Digest-pinned: Renovate bumps this on each new migrate-latest push.
              # Placeholder digest — non-deployable until first real image is pushed.
              tag: migrate-latest@sha256:c3512917c72f80020ff09d778ae4bdf5a6c393e91d5b8d8064202f5a11f076c9
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: budget-pguser-secret
                    key: uri
        containers:
          app:
            image:
              repository: ghcr.io/pipitonelabs/budget-app
              # Digest-pinned: Renovate bumps this on each new latest push.
              # Placeholder digest — non-deployable until first real image is pushed.
              tag: latest@sha256:b5cbd27339d53a9cfd362af39636adfbbe10e52439f3c91bba06326c3886f160
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: budget-pguser-secret
                    key: uri
              AUTH_URL: "https://budget.pipitonelabs.com"
              AUTH_TRUST_HOST: "true"
              NODE_ENV: production
              PORT: "3000"
              HOSTNAME: "0.0.0.0"
            envFrom:
              - secretRef:
                  name: budget-app-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-login
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        controller: main
        ports:
          http:
            port: 3000
