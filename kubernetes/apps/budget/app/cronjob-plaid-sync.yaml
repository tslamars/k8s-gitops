---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: budget-plaid-sync
  namespace: budget
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  schedule: "0 */4 * * *"   # every 4 hours
  concurrencyPolicy: Forbid  # skip if previous run is still going
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-login
          containers:
            - name: sync
              image: curlimages/curl:8.21.0
              command:
                - sh
                - -c
                - |
                  echo "[plaid-sync] starting at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  RESULT=$(curl -sv \
                    -X POST \
                    -H "Content-Type: application/json" \
                    -H "x-cron-secret: ${PLAID_CRON_SECRET}" \
                    -w '\nHTTP_CODE:%{http_code}' \
                    http://budget-app.budget.svc.cluster.local:3000/api/internal/plaid/sync-all 2>&1)
                  echo "[plaid-sync] result: ${RESULT}"
                  echo "[plaid-sync] done at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              env:
                - name: PLAID_CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: budget-app-secret
                      key: PLAID_CRON_SECRET
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
