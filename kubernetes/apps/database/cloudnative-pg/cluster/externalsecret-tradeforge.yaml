---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Password for the PostgREST login role (authenticator), consumed by
# Cluster.spec.managed.roles. Sourced from the shared `cloudnative-pg` 1Password
# item, same as every other app's <app>_postgres_* credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tradeforge-pg-authenticator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tradeforge-pg-authenticator
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .tradeforge_authenticator_username }}"
        password: "{{ .tradeforge_authenticator_password }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Password for the supabase_admin superuser role, used by Supabase Studio +
# postgres-meta. Studio hardcodes user=supabase_admin in its connection
# overrides to postgres-meta, so the role must exist in tradeforge-pg.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tradeforge-pg-supabase-admin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tradeforge-pg-supabase-admin
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .tradeforge_supabase_admin_username }}"
        password: "{{ .tradeforge_supabase_admin_password }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Password for the Realtime login role (tradeforge_realtime), consumed by
# Cluster.spec.managed.roles.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tradeforge-pg-realtime
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tradeforge-pg-realtime
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .tradeforge_realtime_username }}"
        password: "{{ .tradeforge_realtime_password }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Password for the Realtime Janitor admin role (supabase_realtime_admin), required
# by supabase/realtime v2.109.0+. Consumed by Cluster.spec.managed.roles.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tradeforge-pg-realtime-admin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tradeforge-pg-realtime-admin
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "supabase_realtime_admin"
        password: "{{ .tradeforge_realtime_password }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
