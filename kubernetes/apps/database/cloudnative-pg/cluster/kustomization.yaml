---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cluster17.yaml
  - ./externalsecret-tradeforge.yaml
  - ./objectstore-outline.yaml
  - ./objectstore-postgres17.yaml
  - ./objectstore-tradeforge.yaml
  - ./outline.yaml
  - ./prometheusrule.yaml
  - ./scheduledbackup.yaml
  - ./tradeforge.yaml
configMapGenerator:
  - name: tradeforge-bootstrap-sql
    files:
      - ./sql/00-supabase-compat.sql
      - ./sql/0001_initial_schema.sql
      - ./sql/0002_harden_rls_drop_public_read.sql
      - ./sql/0003_reporter_rate_limit.sql
      - ./sql/0004_performance_indexes.sql
      - ./sql/0005_rename_ticino_to_swappybot.sql
      # Phase 3 of the rename. Safe on a FRESH bootstrap (0005's compat views
      # are created and dropped in the same initdb run, before any client ever
      # sees them) — but on the LIVE cluster this only runs via
      # postInitApplicationSQLRefs at cluster creation, never on an existing
      # one. Apply 0006 to the live cluster by hand once the reporter/web
      # rollout is verified; this bootstrap entry does not do that for you.
      - ./sql/0006_drop_ticino_compat.sql
      - ./sql/seed.sql
generatorOptions:
  disableNameSuffixHash: true
