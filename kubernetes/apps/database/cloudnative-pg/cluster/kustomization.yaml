---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cluster17.yaml
  - ./externalsecret-tradeforge.yaml
  - ./objectstore-outline.yaml
  - ./objectstore-postgres17.yaml
  - ./objectstore-tradeforge.yaml
  - ./outline.yaml
  - ./prometheusrule.yaml
  - ./scheduledbackup.yaml
  - ./tradeforge.yaml
configMapGenerator:
  - name: tradeforge-bootstrap-sql
    files:
      - ./sql/00-supabase-compat.sql
      - ./sql/0001_initial_schema.sql
      - ./sql/0002_harden_rls_drop_public_read.sql
      - ./sql/0003_reporter_rate_limit.sql
      - ./sql/0004_performance_indexes.sql
      - ./sql/0005_rename_ticino_to_swappybot.sql
      # 0006_drop_ticino_compat.sql is intentionally NOT bootstrapped yet — it
      # is Phase 3 of the rename and must not run until the reporter and web
      # images are rebuilt against the swappybot_* names. Add it here, and to
      # tradeforge.yaml, once that rollout is verified.
      - ./sql/seed.sql
generatorOptions:
  disableNameSuffixHash: true
