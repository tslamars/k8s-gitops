---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# postgres-meta: HTTP API Studio uses to introspect schemas, tables, policies,
# functions, etc. Connects to tradeforge-pg as the CNPG-generated superuser so
# it can see all schemas (including auth/storage/realtime).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app supabase-postgres-meta
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      postgres-meta:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: supabase/postgres-meta
              tag: v0.96.6@sha256:a84cc713585eea7b401e4a2561ec4a1e48c87083d1c7ecb4502f204bb4391300
            env:
              PG_META_PORT: &port 8080
              PG_META_DB_HOST: tradeforge-pg-rw.database.svc.cluster.local
              PG_META_DB_PORT: "5432"
              PG_META_DB_NAME: tradeforge
              PG_META_DB_SSL_MODE: require
              PG_META_DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: tradeforge-pg-superuser
                    key: username
              PG_META_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: tradeforge-pg-superuser
                    key: password
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: postgres-meta
        ports:
          http:
            port: *port
