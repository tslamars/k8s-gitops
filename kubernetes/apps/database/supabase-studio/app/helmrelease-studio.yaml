---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Supabase Studio: web UI for managing the tradeforge-pg project.
# - STUDIO_PG_META_URL points at the in-cluster postgres-meta Service.
# - SUPABASE_URL / SUPABASE_PUBLIC_URL point at the tradeforge HTTPRoute, which
#   already exposes PostgREST (/rest/v1), Realtime (/realtime/v1), and the
#   reporter function. Studio uses this for its SQL editor, table editor live
#   updates, and auto-generated API snippets.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app supabase-studio
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      studio:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: supabase/studio
              # Pinned to the version used by supabase-community/supabase-kubernetes;
              # newer (2026.05.x) builds added required envs like
              # EDGE_FUNCTIONS_MANAGEMENT_FOLDER that crash routes when missing.
              tag: 2026.04.27-sha-5f60601@sha256:d8306b216ccbddaae9adc8964eae39a32d6f79126fbc88c2fffb00185ed0bb12
            env:
              HOSTNAME: 0.0.0.0
              STUDIO_PG_META_URL: http://supabase-postgres-meta.database.svc.cluster.local:8080
              DEFAULT_ORGANIZATION_NAME: pipitonelabs
              DEFAULT_PROJECT_NAME: tradeforge
              # SUPABASE_URL is what Studio uses for its in-app "API Docs" /
              # auto-generated client snippets. SUPABASE_PUBLIC_URL is rendered
              # into the browser. Both point at the existing tradeforge gateway,
              # which already exposes /rest/v1 (PostgREST) and /realtime/v1.
              SUPABASE_URL: https://tradeforge.pipitonelabs.com
              SUPABASE_PUBLIC_URL: https://tradeforge.pipitonelabs.com
              # Surfaced in Studio's Database settings panel.
              POSTGRES_HOST: tradeforge-pg-rw.database.svc.cluster.local
              POSTGRES_PORT: "5432"
              POSTGRES_DB: tradeforge
              NEXT_PUBLIC_ENABLE_LOGS: "false"
              NEXT_TELEMETRY_DISABLED: "1"
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: tradeforge-pg-superuser
                    key: password
            envFrom:
              # AUTH_JWT_SECRET, SUPABASE_ANON_KEY, SUPABASE_SERVICE_KEY
              - secretRef:
                  name: supabase-studio-secret
            probes:
              # `/` 307-redirects to `/project/default`; k8s probes accept 3xx.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3000
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # Supabase Studio's image declares USER nextjs (UID 1001).
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: studio
        ports:
          http:
            port: *port
