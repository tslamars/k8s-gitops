---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Studio needs the JWT signing secret + anon/service-role JWTs to render
# auto-generated client snippets and to call the project's API. We reuse the
# existing `tradeforge` 1Password item (same source the tradeforge app uses).
# postgres-meta connects as DB superuser via the CNPG-managed
# `tradeforge-pg-superuser` secret directly (no ExternalSecret needed).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: supabase-studio-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: supabase-studio-secret
    template:
      data:
        AUTH_JWT_SECRET: "{{ .JWT_SECRET }}"
        SUPABASE_ANON_KEY: "{{ .anon_jwt }}"
        SUPABASE_SERVICE_KEY: "{{ .service_role_jwt }}"
  dataFrom:
    - extract:
        key: tradeforge
