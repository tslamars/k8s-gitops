---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      reporting_enabled: "false"
    auth:
      signout_redirect_url: https://sso.pipitonelabs.com/application/o/grafana/end-session/
      oauth_auto_login: "false"
      oauth_allow_insecure_email_lookup: "true"
    auth.anonymous:
      enabled: "true"
      org_role: Viewer
      hide_version: "true"
    auth.generic_oauth:
      name: authentik
      enabled: "true"
      scopes: openid email profile
      auth_url: https://sso.pipitonelabs.com/application/o/authorize/
      token_url: https://sso.pipitonelabs.com/application/o/token/
      api_url: https://sso.pipitonelabs.com/application/o/userinfo/
      role_attribute_path: "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'"
    news:
      news_feed_enabled: "false"
    server:
      root_url: https://grafana.pipitonelabs.com
    security:
      angular_support_enabled: "true"
    plugins:
      allow_loading_unsigned_plugins: natel-discrete-panel,pr0ps-trackmap-panel,panodata-map-panel
      plugin_admin_enabled: "false"
    date_formats:
      use_browser_locale: "true"
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              envFrom:
                - secretRef:
                    name: grafana-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: grafana-data
                  mountPath: /var/lib/grafana
          securityContext:
            runAsNonRoot: true
            runAsUser: 472
            runAsGroup: 472
            fsGroup: 472
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana
  service:
    metadata:
      labels:
        dashboards: grafana
    spec:
      ports:
        - name: grafana
          port: 3000
          protocol: TCP
          targetPort: 3000
  httpRoute:
    spec:
      hostnames:
        - grafana.pipitonelabs.com
      parentRefs:
        - name: envoy-internal
          namespace: networking
  disableDefaultSecurityContext: All
