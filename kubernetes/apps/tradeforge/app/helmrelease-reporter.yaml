---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tradeforge-reporter
  namespace: &namespace tradeforge
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      reporter:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 2
        containers:
          app:
            image:
              repository: ghcr.io/pipitonelabs/tradeforge-selfhost-reporter
              # Digest-pinned: Spegel serves the mutable `latest` tag from peer
              # cache, so a bare `latest` won't pull new builds. Renovate bumps
              # the digest on each new image.
              tag: latest@sha256:9855da63c451202ec1be37c58caf9e78c3c4775463bb62c4ed47b7106ef594fd
            env:
              # Reporter writes via PostgREST (internal) as the service role.
              SUPABASE_URL: http://tradeforge-postgrest.tradeforge.svc.cluster.local:3000
              SUPABASE_SERVICE_ROLE_KEY:
                valueFrom:
                  secretKeyRef:
                    name: tradeforge-secret
                    key: SERVICE_ROLE_KEY
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-login
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: reporter
        ports:
          http:
            port: 8000
