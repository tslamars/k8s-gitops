---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tradeforge-realtime
  namespace: &namespace tradeforge
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      realtime:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          seed-tenant:
            image:
              repository: docker.io/postgres
              tag: "17-alpine"
            command: ["/bin/sh", "-c"]
            args:
              - |
                CONNSTR="host=$DB_HOST port=$DB_PORT dbname=$DB_NAME user=$DB_USER password=$DB_PASSWORD sslmode=require"
                # Both id columns are uuid NOT NULL with no DB default (Ecto-managed).
                # inserted_at/updated_at are also NOT NULL with no default.
                # Always remove the realtime-dev seed tenant so SEED_SELF_HOST
                # re-creates it with the current DB_ADMIN_PASSWORD on startup.
                # It was seeded with stale/empty credentials on the first v2.109.0
                # boot (before DB_ADMIN_PASSWORD was provisioned), so without this
                # the Janitor always fails auth as supabase_realtime_admin.
                psql "$CONNSTR" \
                  -c "DELETE FROM _realtime.tenants WHERE external_id = 'realtime-dev';"
                psql "$CONNSTR" \
                  -c "INSERT INTO _realtime.tenants
                        (id, name, external_id, jwt_secret, inserted_at, updated_at)
                      VALUES
                        (gen_random_uuid(), 'tradeforge', 'tradeforge', '$API_JWT_SECRET', NOW(), NOW())
                      ON CONFLICT (external_id) DO NOTHING;" \
                  -c "INSERT INTO _realtime.extensions
                        (id, type, settings, tenant_external_id, inserted_at, updated_at)
                      VALUES (
                        gen_random_uuid(),
                        'postgres_cdc_rls',
                        jsonb_build_object(
                          'region',      'us-east-1',
                          'db_host',     '$DB_HOST',
                          'db_name',     '$DB_NAME',
                          'db_user',     '$DB_USER',
                          'db_password', '$DB_PASSWORD',
                          'db_port',     '$DB_PORT',
                          'ip_version',  'IPv4',
                          'publication', 'supabase_realtime',
                          'slot',        'supabase_realtime_replication_slot'
                        ),
                        'tradeforge',
                        NOW(), NOW()
                      )
                      ON CONFLICT (tenant_external_id, type) DO NOTHING;"
            env:
              DB_HOST: tradeforge-pg-rw.database.svc.cluster.local
              DB_PORT: "5432"
              DB_NAME: tradeforge
              DB_USER: tradeforge_realtime
            envFrom:
              - secretRef:
                  name: tradeforge-secret
        containers:
          app:
            image:
              repository: docker.io/supabase/realtime
              tag: v2.109.0
            env:
              PORT: "4000"
              DB_HOST: tradeforge-pg-rw.database.svc.cluster.local
              DB_PORT: "5432"
              DB_NAME: tradeforge
              DB_USER: tradeforge_realtime
              DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
              APP_NAME: realtime
              ERL_AFLAGS: -proto_dist inet_tcp
              DNS_NODES: "''"
              RLIMIT_NOFILE: "10000"
              SEED_SELF_HOST: "true" # auto-provisions the realtime-dev tenant
              DB_ADMIN_USER: supabase_realtime_admin
              # DB_ADMIN_PASSWORD is injected from tradeforge-secret via envFrom
              RUN_JANITOR: "true"
              DISABLE_HEALTHCHECK_LOGGING: "true"
              # Realtime reuses the shared HS256 secret for the metrics endpoint
              METRICS_JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: tradeforge-secret
                    key: API_JWT_SECRET
            envFrom:
              # DB_PASSWORD, API_JWT_SECRET, SECRET_KEY_BASE, DB_ENC_KEY (others ignored)
              - secretRef:
                  name: tradeforge-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4000
                  initialDelaySeconds: 20
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4000
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            # The supabase/realtime entrypoint starts as root and drops to
            # `nobody` itself via `sudo -E -u nobody` to run migrations + server,
            # so it needs root + privilege escalation (no restrictive SC here).
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: realtime
        ports:
          http:
            port: 4000
