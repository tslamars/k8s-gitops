---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tradeforge-realtime
  namespace: &namespace tradeforge
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      realtime:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/supabase/realtime
              tag: v2.128.3
            env:
              PORT: "4000"
              DB_HOST: tradeforge-pg-rw.database.svc.cluster.local
              DB_PORT: "5432"
              DB_NAME: tradeforge
              # v2.109.0+ (PR #1954) splits DB credentials: migrations connect as
              # DB_USER/DB_PASSWORD, while the Janitor and every per-tenant runtime
              # connection use DB_USER_REALTIME/DB_PASS_REALTIME (default user
              # `supabase_realtime_admin`). We point both at tradeforge_realtime —
              # already a superuser — so there is a single credential to manage.
              DB_USER: tradeforge_realtime
              DB_USER_REALTIME: tradeforge_realtime
              # DB_PASSWORD and DB_PASS_REALTIME are injected from tradeforge-secret
              # via envFrom; both resolve to tradeforge_realtime's password.
              DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
              APP_NAME: realtime
              ERL_AFLAGS: -proto_dist inet_tcp
              DNS_NODES: "''"
              RLIMIT_NOFILE: "10000"
              # SEED_SELF_HOST provisions one tenant on every boot. Naming it
              # `tradeforge` makes Realtime create OUR tenant itself, with the DB
              # credentials + jwt_secret correctly encrypted (DB_ENC_KEY) and the
              # CDC publication/slot_name defaults applied. This replaces the old
              # init container, which wrote those fields in plaintext (Realtime
              # then failed to decrypt jwt_secret -> ErrorConnectingToWebsocket
              # signature_error).
              SEED_SELF_HOST: "true"
              SELF_HOST_TENANT_NAME: tradeforge
              RUN_JANITOR: "true"
              DISABLE_HEALTHCHECK_LOGGING: "true"
              # Realtime reuses the shared HS256 secret for the metrics endpoint
              METRICS_JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: tradeforge-secret
                    key: API_JWT_SECRET
            envFrom:
              # DB_PASSWORD, DB_PASS_REALTIME, API_JWT_SECRET, SECRET_KEY_BASE,
              # DB_ENC_KEY (others ignored)
              - secretRef:
                  name: tradeforge-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4000
                  initialDelaySeconds: 20
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4000
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
            # The supabase/realtime entrypoint starts as root and drops to
            # `nobody` itself via `sudo -E -u nobody` to run migrations + server,
            # so it needs root + privilege escalation (no restrictive SC here).
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: realtime
        ports:
          http:
            port: 4000
